spring:
  application:
    name: community
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/community}
    username: ${SPRING_DATASOURCE_USERNAME:community}
    password: ${SPRING_DATASOURCE_PASSWORD:community}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080

app.cors.allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

app:
  seed-path: ${APP_SEED_PATH:../seed/seed.json}
  seed-enabled: ${APP_SEED_ENABLED:true}
